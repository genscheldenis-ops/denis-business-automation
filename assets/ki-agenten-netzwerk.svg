@media(prefers-reduced-motion:reduce){.agent-name,.agent-desc,.io-label,.io-desc{paint-order:stroke fill;stroke:rgba(244,251,255,.76);stroke-width:2px;stroke-linejoin:round}
.agent-connection{animation:none}}
