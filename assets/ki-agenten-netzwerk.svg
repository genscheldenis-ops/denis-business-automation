<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-label="Sechs verbundene KI-Agenten: Lesen, Auslesen, Prüfen, Zuordnen, CRM-Abgleich und Ablage. Die Agenten tauschen Daten miteinander aus und verteilen Ergebnisse auf CRM und Dokumentenablage.">
