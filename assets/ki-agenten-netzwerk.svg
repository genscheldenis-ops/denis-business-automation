.agent-name,.agent-desc,.io-label,.io-desc{paint-order:stroke fill;stroke:rgba(244,251,255,.76);stroke-width:2px;stroke-linejoin:round}
.agent-connection{animation:moveLine 3.7s linear infinite;animation-delay:var(--delay);opacity:.92}
.agent-connection.cross{opacity:.65}.agent-connection.return{opacity:.78}
